name: Build OpenWrt X86_64 Mini   # ← 这里定义了显示名称，解决路径问题
on:
  push:
    branches: [ main, master ]    # 按需修改触发分支
  workflow_dispatch:              # 支持手动触发

env:
  FIRMWARE_RELEASE: "true"        # 是否发布到 Release（设为 true）
  FIRMWARE_PATH: "./bin/targets"  # 固件生成目录，根据实际修改
  DEVICE_TARGET: "x86"
  DEVICE_SUBTARGET: "64"
  REPO_URL: "https://github.com/openwrt/openwrt"
  REPO_BRANCH: "main"
  KERNEL: "6.6"                   # 示例值，按实际修改

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------
      # 第一步：你的编译过程（请替换为实际步骤）
      # ---------------------------
      - name: Compile OpenWrt
        id: compile                     # 必须保留 id，后续步骤依赖它
        run: |
          echo "模拟编译..."
          # 这里放你实际的编译命令，编译成功后设置输出状态
          echo "status=success" >> $GITHUB_OUTPUT
          # 同时设置一些环境变量供 Release 使用（示例）
          echo "COMMIT_AUTHOR=YourName" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(date)" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=Auto build" >> $GITHUB_ENV
          echo "COMMIT_HASH=abc123" >> $GITHUB_ENV

      # ---------------------------
      # 以下是你提供的 Release 相关步骤（未作修改）
      # ---------------------------
      - name: Set unique release tag
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        id: tag
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          RUN_NUM=${{ github.run_number }}
          UNIQUE_TAG="R${DATE}-${RUN_NUM}"
          RELEASE_NAME="Release ${DATE} (Build #${RUN_NUM})"
          echo "DATE=${DATE}" >> $GITHUB_ENV
          echo "UNIQUE_TAG=${UNIQUE_TAG}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

      - name: Upload Firmware To Release
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.RELEASE_NAME }}
          allowUpdates: false
          tag: ${{ env.UNIQUE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **This is OpenWrt Firmware for ${{ env.UNIQUE_TAG }} (Mini Edition)**
            ### 📒 固件信息
            - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🎨 LuCI 分支: openwrt-25.12
            - 🚀 内核版本: ${{ env.KERNEL }}
            - 🌐 默认地址: 10.0.0.1
            - 🔑 默认密码: 无（首次登录需设置密码）
            - 🐚 默认 Shell: zsh (oh-my-zsh)
            ### 📦 预装插件
            - 🔧 PassWall (科学上网)
            - 🐳 DockerMan (Docker 管理)
            - 💾 DiskMan (磁盘管理)
            - 🍀 Lucky (DDNS/反向代理/端口转发)
            - 📢 PushBot (消息推送)
            - 📊 Nlbwmon (流量监控)
            - 📁 Samba4 (文件共享，多通道)
            - 🖥️ TTYD (Web 终端)
            - 🔄 UPnP
            - 📂 FileTransfer (文件传输)
            - 🔗 ARP绑定
            ### 🧊 固件版本
            - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
            - ${{ env.COMMIT_AUTHOR }}
            - ${{ env.COMMIT_DATE }}
            - ${{ env.COMMIT_MESSAGE }}
            - ${{ env.COMMIT_HASH }}

      - name: Delete old releases (keep latest 5)
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = releases.slice(5);
            for (const rel of toDelete) {
              console.log(`Deleting release ${rel.name} (${rel.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });
              if (rel.tag_name) {
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${rel.tag_name}`
                  });
                  console.log(`Deleted tag ${rel.tag_name}`);
                } catch (e) {
                  console.log(`Failed to delete tag ${rel.tag_name}: ${e.message}`);
                }
              }
            }
            console.log(`Deleted ${toDelete.length} old releases.`);
