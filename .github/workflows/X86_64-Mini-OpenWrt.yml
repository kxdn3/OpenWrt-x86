name: Build OpenWrt (Mini)

on:
  workflow_dispatch:                      # 支持手动触发
  schedule:
    - cron: '0 17 * * *'                  # 每天 UTC 1:00 自动编译（北京时间 9:00）

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      REPO_URL: https://github.com/coolsnowwolf/lede
      REPO_BRANCH: master
      DEVICE_TARGET: x86
      DEVICE_SUBTARGET: 64
      FIRMWARE_PATH: ./bin/targets/x86/64
      FIRMWARE_RELEASE: true
      KERNEL: 6.6
      SOURCE_REPO: lede                 # 保留你原有的变量，用于上传 artifact 名称
      FILE_DATE: ${{ github.run_number }}  # 如果需要可保留

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gettext git libelf-dev libncurses5-dev libssl-dev \
            python3 python3-distutils python3-setuptools rsync swig \
            unzip zlib1g-dev file wget

      - name: Clone OpenWrt source
        run: |
          git clone --depth=1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          echo "OPENWRT_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Update feeds and install packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cd openwrt
          # ⚠️ 请将以下示例配置替换为你自己完整的 .config 配置
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
          # 添加你需要的其他配置（插件、内核选项等）
          make defconfig

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          # 提取编译信息用于 Release 描述
          echo "KERNEL=$(cat .config | grep CONFIG_KERNEL_VERSION | cut -d= -f2 | tr -d '"')" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --format='%an')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --format=%s)" >> $GITHUB_ENV

      - name: Prepare firmware artifacts
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        run: |
          cd openwrt
          mkdir -p ./firmware
          cp -r ${{ env.FIRMWARE_PATH }}/* ./firmware/
          echo "FIRMWARE_PATH=./firmware" >> $GITHUB_ENV

      # ⭐ 生成唯一 Tag（日期 + 运行序号）
      - name: Set unique release tag
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        id: tag
        run: |
          DATE=$(date +%Y%m%d)
          RUN_NUM=${{ github.run_number }}
          echo "UNIQUE_TAG=R${DATE}-${RUN_NUM}" >> $GITHUB_ENV
          echo "RELEASE_NAME=R${DATE} for ${UNIQUE_TAG}" >> $GITHUB_ENV

      - name: Upload Firmware To Release
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: R${{ env.DATE }} for ${{ env.UNIQUE_TAG }}   # 使用唯一 tag 作为名称
          allowUpdates: false                                # 禁止覆盖，每次新建
          tag: ${{ env.UNIQUE_TAG }}                         # 使用唯一 tag
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **This is OpenWrt Firmware for ${{ env.UNIQUE_TAG }} (Mini Edition)**
            ### 📒 固件信息
            - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🎨 LuCI 分支: openwrt-25.12
            - 🚀 内核版本: ${{ env.KERNEL }}
            - 🌐 默认地址: 10.0.0.1
            - 🔑 默认密码: 无（首次登录需设置密码）
            - 🐚 默认 Shell: zsh (oh-my-zsh)
            ### 📦 预装插件
            - 🔧 PassWall (科学上网)
            - 🐳 DockerMan (Docker 管理)
            - 💾 DiskMan (磁盘管理)
            - 🍀 Lucky (DDNS/反向代理/端口转发)
            - 📢 PushBot (消息推送)
            - 📊 Nlbwmon (流量监控)
            - 📁 Samba4 (文件共享，多通道)
            - 🖥️ TTYD (Web 终端)
            - 🔄 UPnP
            - 📂 FileTransfer (文件传输)
            - 🔗 ARP绑定
            ### 🧊 固件版本
            - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
            - ${{ env.COMMIT_AUTHOR }}
            - ${{ env.COMMIT_DATE }}
            - ${{ env.COMMIT_MESSAGE }}
            - ${{ env.COMMIT_HASH }}

      # ⭐ 清理旧 Release，只保留最新的 5 个（使用 github-script 最稳定）
      - name: Delete old releases (keep latest 5)
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // 按创建时间降序排序（最新的在前）
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = releases.slice(5); // 保留前5个，其余删除
            for (const rel of toDelete) {
              console.log(`Deleting release ${rel.name} (${rel.id})`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id
              });
              // 同时删除关联的 Git 标签
              if (rel.tag_name) {
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${rel.tag_name}`
                  });
                  console.log(`Deleted tag ${rel.tag_name}`);
                } catch (e) {
                  console.log(`Failed to delete tag ${rel.tag_name}: ${e.message}`);
                }
              }
            }
            console.log(`Deleted ${toDelete.length} old releases.`);
