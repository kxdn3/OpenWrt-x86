name: X86_64 Mini OpenWrt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: configs/x86_64-mini.config
  DIY_SCRIPT: diy-mini.sh
  CLASH_KERNEL: amd64
  CACHE_TOOLCHAIN: true
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: X86_64
  RELEASE_TAG: X86_64-${{ github.run_number }}
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04

    steps:

    - name: 检出代码
      uses: actions/checkout@v4

    - name: 初始化环境
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo apt-get update
        sudo apt-get install -y rename
        sudo timedatectl set-timezone "$TZ"

    - name: 查看服务器信息
      run: |
        echo "CPU:"
        nproc
        echo "MEM:"
        free -h
        echo "DISK:"
        df -h

    - name: 下载OpenWrt源码
      run: |
        git clone \
        --depth=1 \
        -b $REPO_BRANCH \
        $REPO_URL \
        openwrt

        cd openwrt

        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

        echo "SOURCE_REPO=lede" >> $GITHUB_ENV

        git log -1 --oneline


    - name: 复制配置
      run: |
        cp $CONFIG_FILE $OPENWRT_PATH/.config

        cd $OPENWRT_PATH

        make defconfig


    - name: 缓存编译环境
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: lede-x86_64-${{ github.run_number }}
        prefix: ${{ env.OPENWRT_PATH }}


    - name: 更新Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a


    - name: 执行DIY脚本
      run: |
        cd $OPENWRT_PATH

        chmod +x $GITHUB_WORKSPACE/$DIY_SCRIPT

        $GITHUB_WORKSPACE/$DIY_SCRIPT


    - name: 安装Feeds并生成配置
      run: |
        cd $OPENWRT_PATH

        ./scripts/feeds install -a

        make defconfig


    - name: 下载源码包
      run: |
        cd $OPENWRT_PATH

        make download -j8

        find dl -size -1024c -delete


    - name: 编译固件
      id: compile
      run: |
        cd $OPENWRT_PATH

        echo "开始编译"

        if ! make -j$(nproc); then

          echo "多线程失败，尝试单线程"

          make -j1 V=s

        fi

        echo "status=success" >> $GITHUB_OUTPUT

        echo "DATE=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

        echo "FILE_DATE=$(date '+%Y.%m.%d')" >> $GITHUB_ENV


    - name: 整理固件
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*

        echo "KERNEL=$(grep '^kernel ' *.manifest | cut -d- -f2)" >> $GITHUB_ENV

        rm -rf packages
        rm -rf *.manifest
        rm -rf *.buildinfo
        rm -rf sha256sums
        rm -rf profiles.json

        rename 's/^/mini-/' *

        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV


    - name: 发布Release
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      with:
        name: OpenWrt Mini ${{ env.DATE }}
        tag: ${{ env.RELEASE_TAG }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        token: ${{ secrets.GITHUB_TOKEN }}

        body: |
          ## OpenWrt x86_64 Mini

          - 源码: ${{ env.REPO_URL }}
          - 分支: ${{ env.REPO_BRANCH }}
          - LuCI: openwrt-25.12
          - Kernel: ${{ env.KERNEL }}
          - IP: 10.0.0.1
          - Rootfs: 2048MB

          插件:
          - PassWall
          - DockerMan
          - DiskMan
          - Lucky
          - PushBot
          - Samba4
          - Argon
          - TTYD


    - name: 清理旧Release
      if: steps.compile.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      run: |

        keep=5

        tags=$(gh release list \
        --limit 100 \
        --json tagName \
        --jq '.[].tagName' | grep "^X86_64-" || true)


        count=$(echo "$tags" | wc -l)


        if [ "$count" -gt "$keep" ]; then

          echo "$tags" | head -n $((count-keep)) | while read tag

          do

            gh release delete "$tag" \
            --yes \
            --cleanup-tag

          done

        fi
